# #102 FLIP: all linters are PINNED flake `checks.<sys>.<tool>` -- no
# runtime `remotes:` git_urls. CI = `nix flake check` on pinned checks.
# Wrapper binaries (lefthook-markdownlint, lefthook-yamllint, etc.) come
# from the devShell, not from remotes.
# History: #97 nixfmt; #98 formatters; #99 nix linters; #100 shell/
# content; #101 git/security.
---

pre-commit:
  commands:
    markdownlint:
      glob: "*.md"
      exclude: "^(\\.claude/skills/)"
      run: timeout ${LEFTHOOK_MARKDOWNLINT_TIMEOUT:-30} lefthook-markdownlint {staged_files}
    markdownlint-agentic:
      glob: "*.md"
      exclude: "^(README|CHANGELOG|SPEC|CONTRIBUTING)\\.md$"
      run: timeout ${LEFTHOOK_MARKDOWNLINT_AGENTIC_TIMEOUT:-30} lefthook-markdownlint-agentic {staged_files}
    yamllint:
      glob: "*.{yml,yaml}"
      run: timeout ${LEFTHOOK_YAMLLINT_TIMEOUT:-30} lefthook-yamllint {staged_files}
    git-no-local-paths:
      exclude: "^flake\\.(nix|lock)$"
      run: timeout ${LEFTHOOK_GIT_NO_LOCAL_PATHS_TIMEOUT:-30} lefthook-git-no-local-paths {staged_files}
    nix-flake-eval:
      glob: "*.nix"
      env:
        LEFTHOOK_NIX_FLAKE_EVAL_ATTR: ".#lib"
      run: timeout ${LEFTHOOK_NIX_FLAKE_EVAL_TIMEOUT:-60} lefthook-nix-flake-eval
    narrow-language-other:
      glob:
        - "*.{yml,yaml,toml,tcl}"
        - "justfile"
        - "Gemfile"
      env:
        NARROW_LANGUAGE_DICT: ".narrow-language-other.dic"
      run: timeout ${LEFTHOOK_NARROW_LANGUAGE_OTHER_TIMEOUT:-30} lefthook-narrow-language {staged_files}
    bats-unit:
      glob: "*.bats"
      run: timeout ${LEFTHOOK_BATS_UNIT_TIMEOUT:-120} bats {staged_files}
    set-skill-extension:
      glob: "set/{skills,drafts}/**"
      run: SET_ROOT=set bash lib/skill-extension-check.sh
    set-skill-size:
      glob: "set/{skills,drafts}/**/*.md"
      run: SET_ROOT=set bash lib/skill-size-check.sh
    set-ref-resolution:
      glob: "set/**/*.md"
      run: SET_ROOT=set REF_MATCH=lib/ref-match.sh bash lib/ref-resolve-check.sh
    set-bundle-content:
      glob: "set/**/*.md"
      run: SET_ROOT=set REF_MATCH=lib/ref-match.sh bash lib/bundle-content-check.sh

pre-push:
  commands:
    markdownlint:
      glob: "*.md"
      exclude: "^(\\.claude/skills/)"
      run: timeout ${LEFTHOOK_MARKDOWNLINT_TIMEOUT:-30} lefthook-markdownlint {push_files}
    markdownlint-agentic:
      glob: "*.md"
      exclude: "^(README|CHANGELOG|SPEC|CONTRIBUTING)\\.md$"
      run: timeout ${LEFTHOOK_MARKDOWNLINT_AGENTIC_TIMEOUT:-30} lefthook-markdownlint-agentic {push_files}
    yamllint:
      glob: "*.{yml,yaml}"
      run: timeout ${LEFTHOOK_YAMLLINT_TIMEOUT:-30} lefthook-yamllint {push_files}
    git-no-local-paths:
      exclude: "^flake\\.(nix|lock)$"
      run: timeout ${LEFTHOOK_GIT_NO_LOCAL_PATHS_TIMEOUT:-30} lefthook-git-no-local-paths {push_files}
    narrow-language-other:
      glob:
        - "*.{yml,yaml,toml,tcl}"
        - "justfile"
        - "Gemfile"
      env:
        NARROW_LANGUAGE_DICT: ".narrow-language-other.dic"
      run: timeout ${LEFTHOOK_NARROW_LANGUAGE_OTHER_TIMEOUT:-30} lefthook-narrow-language {push_files}
    bats-unit:
      glob: "*.bats"
      run: timeout ${LEFTHOOK_BATS_UNIT_TIMEOUT:-120} bats {push_files}
    set-skill-extension:
      glob: "set/{skills,drafts}/**"
      run: SET_ROOT=set bash lib/skill-extension-check.sh
    set-skill-size:
      glob: "set/{skills,drafts}/**/*.md"
      run: SET_ROOT=set bash lib/skill-size-check.sh
    set-ref-resolution:
      glob: "set/**/*.md"
      run: SET_ROOT=set REF_MATCH=lib/ref-match.sh bash lib/ref-resolve-check.sh
    set-bundle-content:
      glob: "set/**/*.md"
      run: SET_ROOT=set REF_MATCH=lib/ref-match.sh bash lib/bundle-content-check.sh
