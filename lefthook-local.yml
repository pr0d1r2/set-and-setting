---
# Override narrow-language remote timeouts for --all-files CI runs.
# lefthook-local.yml has higher merge priority than remotes, so these
# values take effect where lefthook.yml cannot override them.

pre-commit:
  commands:
    narrow-language-markdown:
      timeout: 300s
    narrow-language-shell:
      timeout: 300s
    narrow-language-nix:
      timeout: 300s
    narrow-language-other:
      timeout: 300s
    markdownlint:
      timeout: 300s
    markdownlint-agentic:
      timeout: 300s

pre-push:
  commands:
    narrow-language-markdown:
      timeout: 300s
    narrow-language-shell:
      timeout: 300s
    narrow-language-nix:
      timeout: 300s
    narrow-language-other:
      timeout: 300s
