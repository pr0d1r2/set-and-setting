---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Linux gates the expensive jobs (darwin runner + aarch64 QEMU).
# nix-lefthook-ci-action installs nix + cachix, then runs lefthook
# pre-commit + pre-push --all-files in the `ci` devShell. skip-build is
# set because this repo has no packages.default; the nix-flake-check
# hook runs `nix flake check`. changelog-touched is a commit-gate hook
# (meaningless on --all-files) so it is excluded from the CI run.
#
# Timeout env vars are passed via extra-env, NOT the workflow env block,
# because the CI action runs `nix develop --ignore-environment` which
# strips all parent env vars. Only extra-env values are injected into
# the nix develop shell as inline env assignments.

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: pr0d1r2/nix-lefthook-ci-action@ce9a118b05e90e186dba48a82067adeed185f7d4
        with:
          skip-build: "true"
          cachix-cache: pr0d1r2
          cachix-auth-token: ${{ github.event_name == 'push' && secrets.CACHIX_AUTH_TOKEN || '' }}
          extra-env: >-
            LEFTHOOK_EXCLUDE=changelog-touched
            LEFTHOOK_TRAILING_WHITESPACE_TIMEOUT=300
            LEFTHOOK_GIT_CONFLICT_MARKERS_TIMEOUT=300
            LEFTHOOK_MISSING_FINAL_NEWLINE_TIMEOUT=300
            LEFTHOOK_FILE_SIZE_CHECK_TIMEOUT=300
            LEFTHOOK_GITLEAKS_TIMEOUT=300
            LEFTHOOK_MARKDOWNLINT_TIMEOUT=300
            LEFTHOOK_MARKDOWNLINT_AGENTIC_TIMEOUT=300
            LEFTHOOK_YAMLLINT_TIMEOUT=300
            LEFTHOOK_GIT_NO_LOCAL_PATHS_TIMEOUT=300
            LEFTHOOK_STATIX_TIMEOUT=300
            LEFTHOOK_BATS_PARSE_TIMEOUT=300
            LEFTHOOK_SHELLCHECK_TIMEOUT=300
            LEFTHOOK_TYPOS_TIMEOUT=300
            LEFTHOOK_UNICODE_LINT_TIMEOUT=300
            LEFTHOOK_ASCII_ONLY_TIMEOUT=300
            LEFTHOOK_NO_SHELL_FUNCTIONS_TIMEOUT=300
            LEFTHOOK_DEADNIX_TIMEOUT=300
            LEFTHOOK_EDITORCONFIG_CHECKER_TIMEOUT=300
            LEFTHOOK_EXECUTE_PERMISSIONS_TIMEOUT=300
            LEFTHOOK_NIXFMT_TIMEOUT=300
            LEFTHOOK_NIX_NO_EMBEDDED_SHELL_TIMEOUT=300
            LEFTHOOK_NIX_FLAKE_EVAL_TIMEOUT=300
            LEFTHOOK_NIX_FLAKE_CHECK_TIMEOUT=300
            LEFTHOOK_SHFMT_TIMEOUT=300
            LEFTHOOK_BATS_UNIT_TIMEOUT=300
          keep-home: "true"

  build-darwin:
    needs: build-linux
    runs-on: macos-latest
    steps:
      - uses: pr0d1r2/nix-lefthook-ci-action@ce9a118b05e90e186dba48a82067adeed185f7d4
        with:
          skip-build: "true"
          cachix-cache: pr0d1r2
          cachix-auth-token: ${{ github.event_name == 'push' && secrets.CACHIX_AUTH_TOKEN || '' }}
          extra-env: >-
            LEFTHOOK_EXCLUDE=changelog-touched
            LEFTHOOK_TRAILING_WHITESPACE_TIMEOUT=300
            LEFTHOOK_GIT_CONFLICT_MARKERS_TIMEOUT=300
            LEFTHOOK_MISSING_FINAL_NEWLINE_TIMEOUT=300
            LEFTHOOK_FILE_SIZE_CHECK_TIMEOUT=300
            LEFTHOOK_GITLEAKS_TIMEOUT=300
            LEFTHOOK_MARKDOWNLINT_TIMEOUT=300
            LEFTHOOK_MARKDOWNLINT_AGENTIC_TIMEOUT=300
            LEFTHOOK_YAMLLINT_TIMEOUT=300
            LEFTHOOK_GIT_NO_LOCAL_PATHS_TIMEOUT=300
            LEFTHOOK_STATIX_TIMEOUT=300
            LEFTHOOK_BATS_PARSE_TIMEOUT=300
            LEFTHOOK_SHELLCHECK_TIMEOUT=300
            LEFTHOOK_TYPOS_TIMEOUT=300
            LEFTHOOK_UNICODE_LINT_TIMEOUT=300
            LEFTHOOK_ASCII_ONLY_TIMEOUT=300
            LEFTHOOK_NO_SHELL_FUNCTIONS_TIMEOUT=300
            LEFTHOOK_DEADNIX_TIMEOUT=300
            LEFTHOOK_EDITORCONFIG_CHECKER_TIMEOUT=300
            LEFTHOOK_EXECUTE_PERMISSIONS_TIMEOUT=300
            LEFTHOOK_NIXFMT_TIMEOUT=300
            LEFTHOOK_NIX_NO_EMBEDDED_SHELL_TIMEOUT=300
            LEFTHOOK_NIX_FLAKE_EVAL_TIMEOUT=300
            LEFTHOOK_NIX_FLAKE_CHECK_TIMEOUT=300
            LEFTHOOK_SHFMT_TIMEOUT=300
            LEFTHOOK_BATS_UNIT_TIMEOUT=300
          keep-home: "true"
          flake-check-timeout: "600"
          flake-eval-timeout: "120"

  build-linux-arm:
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: pr0d1r2/nix-lefthook-ci-action@ce9a118b05e90e186dba48a82067adeed185f7d4
        with:
          extra-platforms: aarch64-linux
          skip-build: "true"
          cachix-cache: pr0d1r2
          cachix-auth-token: ${{ github.event_name == 'push' && secrets.CACHIX_AUTH_TOKEN || '' }}
          extra-env: >-
            LEFTHOOK_EXCLUDE=changelog-touched
            LEFTHOOK_TRAILING_WHITESPACE_TIMEOUT=300
            LEFTHOOK_GIT_CONFLICT_MARKERS_TIMEOUT=300
            LEFTHOOK_MISSING_FINAL_NEWLINE_TIMEOUT=300
            LEFTHOOK_FILE_SIZE_CHECK_TIMEOUT=300
            LEFTHOOK_GITLEAKS_TIMEOUT=300
            LEFTHOOK_MARKDOWNLINT_TIMEOUT=300
            LEFTHOOK_MARKDOWNLINT_AGENTIC_TIMEOUT=300
            LEFTHOOK_YAMLLINT_TIMEOUT=300
            LEFTHOOK_GIT_NO_LOCAL_PATHS_TIMEOUT=300
            LEFTHOOK_STATIX_TIMEOUT=300
            LEFTHOOK_BATS_PARSE_TIMEOUT=300
            LEFTHOOK_SHELLCHECK_TIMEOUT=300
            LEFTHOOK_TYPOS_TIMEOUT=300
            LEFTHOOK_UNICODE_LINT_TIMEOUT=300
            LEFTHOOK_ASCII_ONLY_TIMEOUT=300
            LEFTHOOK_NO_SHELL_FUNCTIONS_TIMEOUT=300
            LEFTHOOK_DEADNIX_TIMEOUT=300
            LEFTHOOK_EDITORCONFIG_CHECKER_TIMEOUT=300
            LEFTHOOK_EXECUTE_PERMISSIONS_TIMEOUT=300
            LEFTHOOK_NIXFMT_TIMEOUT=300
            LEFTHOOK_NIX_NO_EMBEDDED_SHELL_TIMEOUT=300
            LEFTHOOK_NIX_FLAKE_EVAL_TIMEOUT=300
            LEFTHOOK_NIX_FLAKE_CHECK_TIMEOUT=300
            LEFTHOOK_SHFMT_TIMEOUT=300
            LEFTHOOK_BATS_UNIT_TIMEOUT=300
          keep-home: "true"
