---
name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  guardrails:
    # Local-path reference (not `@main`): resolves to THIS commit's copy of
    # guardrails.yml, so fixes to the reusable workflow on a PR branch are
    # exercised by the PR's own CI. `@main` pinned to main's stale copy, so
    # the darwin-installer fix (B26) never ran on the PR that introduced it.
    uses: ./.github/workflows/guardrails.yml

  cache-push:
    needs: guardrails
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      NIX_CONFIG: |
        connect-timeout = 15
        download-attempts = 5
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            max-jobs = auto
            extra-substituters = https://pr0d1r2.cachix.org
            extra-trusted-public-keys = pr0d1r2.cachix.org-1:NfWjbhgAj41byXhCKiaE+av3Vnphm1fTezHXEGsiQIM=
      - name: Upload evaluated standard paths
        # Best-effort: a cache is not a check, and every gate has already
        # passed by the time this job runs (B19). The cost of that choice is
        # that a broken token is silent -- read the push step's log, not its
        # conclusion, when cache hits stop appearing.
        continue-on-error: true
        uses: cachix/cachix-action@v15
        with:
          name: pr0d1r2
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build standard delivery paths and every check
        run: |
          nix build .#set .#setting --no-link
          nix flake check --print-build-logs

  cache-push-darwin:
    needs: guardrails
    if: github.event_name == 'push'
    runs-on: macos-latest
    env:
      NIX_CONFIG: |
        connect-timeout = 15
        download-attempts = 5
    steps:
      - uses: actions/checkout@v4
      # Same installer as the darwin guardrails job, for the same reason (B26).
      - uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41
        with:
          extra-conf: |
            max-jobs = auto
            extra-substituters = https://pr0d1r2.cachix.org
            extra-trusted-public-keys = pr0d1r2.cachix.org-1:NfWjbhgAj41byXhCKiaE+av3Vnphm1fTezHXEGsiQIM=
      - name: Upload evaluated standard paths
        continue-on-error: true
        uses: cachix/cachix-action@v15
        with:
          name: pr0d1r2
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build standard delivery paths and every check
        run: |
          nix build .#set .#setting --no-link
          nix flake check --print-build-logs

  lock-growth-comment:
    needs: guardrails
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Measure lock growth
        id: measure
        run: |
          set +e
          FLAKE_LOCK=flake.lock FLAKE_LOCK_BUDGET=config/lefthook/flake_lock_budget.yml \
            bash lib/flake-lock-ratchet-check.sh | tee lock-growth.txt
          code=${PIPESTATUS[0]}
          grep -E '^PASS:|^NOTICE:' lock-growth.txt || true
          metrics=$(grep '^PASS:' lock-growth.txt | sed -E 's/^PASS: lock //')
          echo "FLAKE_LOCK_METRICS=$metrics" >> "$GITHUB_ENV"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # Growth notices are advisory (exit 2), but malformed locks and
          # sanity-cap violations (exit 1) must still fail this check.
          if [ "$code" -eq 1 ]; then exit 1; fi
          exit 0
      - name: Update lock growth comment
        if: steps.measure.outputs.code == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          marker='<!-- flake-lock-growth -->'
          body="$marker
          Lock growth crossed the configured threshold. Metrics: ${FLAKE_LOCK_METRICS:-unavailable}."
          api="repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments"
          comment=$(gh api "$api" --paginate --jq '.[] | select(.body | contains("<!-- flake-lock-growth -->")) | .id' | head -n1)
          if [ -n "$comment" ]; then
            gh api --method PATCH "$api/$comment" -f body="$body"
          else
            gh api --method POST "$api" -f body="$body"
          fi
