---
name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]

env:
  NIX_CONFIG: access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

jobs:
  guardrails:
    # Local-path reference (not `@main`): resolves to THIS commit's copy of
    # guardrails.yml, so fixes to the reusable workflow on a PR branch are
    # exercised by the PR's own CI. `@main` pinned to main's stale copy, so
    # the darwin-installer fix (B26) never ran on the PR that introduced it.
    uses: ./.github/workflows/guardrails.yml
    secrets: inherit

  lock-budget-comment:
    needs: guardrails
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Report lock growth
        run: |
          set -euo pipefail
          report="$(bash lib/nix-flake-lock-budget.sh flake.lock 2>&1 || true)"
          bytes="$(printf '%s\n' "$report" | sed -n 's/lock-budget: bytes=\([0-9]*\).*/\1/p')"
          baseline="$(sed -n 's/^baseline_bytes: *//p' config/lefthook/flake_lock_budget.yml)"
          [ -n "$bytes" ] && [ "$bytes" -gt "$baseline" ] || exit 0
          printf '%s\n' "$report" > lock-budget-report
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: lock-budget-report
          path: lock-budget-report
          if-no-files-found: ignore

  lock-budget-publish:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v4
        with:
          name: lock-budget-report
          path: .
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Publish lock growth comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          [ -f lock-budget-report ] || exit 0
          report="$(cat lock-budget-report)"
          body="<!-- lock-budget-report -->\n### flake.lock growth\n\n\`$report\`\n\nThe committed lock baseline was updated with this lock refresh."
          export BODY="$body"
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate --jq '.[] | select(.body | contains("<!-- lock-budget-report -->")) | .id' | head -n1)"
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -f body="$BODY"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="$BODY"
          fi

  cache-push:
    needs: guardrails
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NIX_CONFIG: |
        connect-timeout = 15
        download-attempts = 5
        fallback = true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          pre-build-commands: |
            echo "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}" | sudo tee -a /etc/nix/nix.conf
          extra_nix_config: |
            max-jobs = auto
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            extra-substituters = https://pr0d1r2.cachix.org
            extra-trusted-public-keys = pr0d1r2.cachix.org-1:NfWjbhgAj41byXhCKiaE+av3Vnphm1fTezHXEGsiQIM=
      - name: Upload evaluated standard paths
        # Best-effort: a cache is not a check, and every gate has already
        # passed by the time this job runs (B19). The cost of that choice is
        # that a broken token is silent -- read the push step's log, not its
        # conclusion, when cache hits stop appearing.
        continue-on-error: true
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: pr0d1r2
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # The checks are pushed by the guardrails jobs that build them; this job
      # adds only the two consumer delivery paths, which the flake check does
      # not build.
      - name: Build the standard delivery paths
        run: nix build .#set .#setting --fallback --no-link

  cache-push-darwin:
    needs: guardrails
    if: github.event_name == 'push'
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      NIX_CONFIG: |
        connect-timeout = 15
        download-attempts = 5
        fallback = true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Same installer as the darwin guardrails job, for the same reason (B26).
      - uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41
        with:
          pre-build-commands: |
            echo "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}" | sudo tee -a /etc/nix/nix.conf
          extra-conf: |
            max-jobs = auto
            extra-substituters = https://pr0d1r2.cachix.org
            extra-trusted-public-keys = pr0d1r2.cachix.org-1:NfWjbhgAj41byXhCKiaE+av3Vnphm1fTezHXEGsiQIM=
      - name: Upload evaluated standard paths
        continue-on-error: true
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: pr0d1r2
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # The checks are pushed by the guardrails jobs that build them; this job
      # adds only the two consumer delivery paths, which the flake check does
      # not build.
      - name: Build the standard delivery paths
        run: nix build .#set .#setting --fallback --no-link
