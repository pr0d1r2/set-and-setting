---
name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  guardrails:
    # Local-path reference (not `@main`): resolves to THIS commit's copy of
    # guardrails.yml, so fixes to the reusable workflow on a PR branch are
    # exercised by the PR's own CI. `@main` pinned to main's stale copy, so
    # the darwin-installer fix (B26) never ran on the PR that introduced it.
    uses: ./.github/workflows/guardrails.yml

  cache-push:
    needs: guardrails
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      NIX_CONFIG: |
        connect-timeout = 15
        download-attempts = 5
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      - name: Upload evaluated standard paths
        continue-on-error: true
        uses: cachix/cachix-action@v15
        with:
          name: pr0d1r2
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build standard delivery paths
        run: nix build .#set .#setting --no-link

  lock-growth-comment:
    needs: guardrails
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Measure lock growth
        id: measure
        run: |
          set +e
          FLAKE_LOCK=flake.lock FLAKE_LOCK_BUDGET=config/lefthook/flake_lock_budget.yml \
            bash lib/flake-lock-ratchet-check.sh | tee lock-growth.txt
          code=${PIPESTATUS[0]}
          grep -E '^PASS:|^NOTICE:' lock-growth.txt || true
          metrics=$(grep '^PASS:' lock-growth.txt | sed -E 's/^PASS: lock //')
          echo "FLAKE_LOCK_METRICS=$metrics" >> "$GITHUB_ENV"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Update lock growth comment
        if: steps.measure.outputs.code == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          marker='<!-- flake-lock-growth -->'
          body="$marker
          Lock growth crossed the configured threshold. Metrics: ${FLAKE_LOCK_METRICS:-unavailable}."
          api="repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments"
          comment=$(gh api "$api" --paginate --jq '.[] | select(.body | contains("<!-- flake-lock-growth -->")) | .id' | head -n1)
          if [ -n "$comment" ]; then
            gh api --method PATCH "$api/$comment" -f body="$body"
          else
            gh api --method POST "$api" -f body="$body"
          fi
