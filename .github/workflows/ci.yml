---
name: CI

permissions:
  contents: read
  issues: write

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  guardrails:
    # Local-path reference (not `@main`): resolves to THIS commit's copy of
    # guardrails.yml, so fixes to the reusable workflow on a PR branch are
    # exercised by the PR's own CI. `@main` pinned to main's stale copy, so
    # the darwin-installer fix (B26) never ran on the PR that introduced it.
    uses: ./.github/workflows/guardrails.yml

  lock-growth:
    needs: guardrails
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update lock-growth marker
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          report="$(bash lib/flake-lock-budget.sh flake.lock config/lefthook/flake_lock_baseline.yml)"
          bytes=$(sed -n 's/.*bytes=\([^ ]*\).*/\1/p' <<<"$report")
          base=$(sed -n 's/.*baseline_bytes=\([^ ]*\).*/\1/p' <<<"$report")
          marker='<!-- set-and-setting:flake-lock-growth -->'
          if [ "$bytes" -le $((base + base / 20)) ]; then exit 0; fi
          body=$(printf '%s\n🔒 flake.lock grew mechanically: **%s bytes** (baseline %s).\n\nThe committed baseline must be refreshed in the same commit as the pin update.\n' "$marker" "$bytes" "$base")
          comments=$(gh api "repos/$REPOSITORY/issues/$PR_NUMBER/comments" --paginate)
          id=$(jq -r --arg marker "$marker" '.[] | select(.body | contains($marker)) | .id' <<<"$comments" | head -n1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/$REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" >/dev/null
          fi

  cache-push:
    needs: guardrails
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      NIX_CONFIG: |
        connect-timeout = 15
        download-attempts = 5
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            max-jobs = auto
            extra-substituters = https://pr0d1r2.cachix.org
            extra-trusted-public-keys = pr0d1r2.cachix.org-1:NfWjbhgAj41byXhCKiaE+av3Vnphm1fTezHXEGsiQIM=
      - name: Upload evaluated standard paths
        # Best-effort: a cache is not a check, and every gate has already
        # passed by the time this job runs (B19). The cost of that choice is
        # that a broken token is silent -- read the push step's log, not its
        # conclusion, when cache hits stop appearing.
        continue-on-error: true
        uses: cachix/cachix-action@v15
        with:
          name: pr0d1r2
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build standard delivery paths and every check
        run: |
          nix build .#set .#setting --no-link
          nix flake check --print-build-logs

  cache-push-darwin:
    needs: guardrails
    if: github.event_name == 'push'
    runs-on: macos-latest
    env:
      NIX_CONFIG: |
        connect-timeout = 15
        download-attempts = 5
    steps:
      - uses: actions/checkout@v4
      # Same installer as the darwin guardrails job, for the same reason (B26).
      - uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41
        with:
          extra-conf: |
            max-jobs = auto
            extra-substituters = https://pr0d1r2.cachix.org
            extra-trusted-public-keys = pr0d1r2.cachix.org-1:NfWjbhgAj41byXhCKiaE+av3Vnphm1fTezHXEGsiQIM=
      - name: Upload evaluated standard paths
        continue-on-error: true
        uses: cachix/cachix-action@v15
        with:
          name: pr0d1r2
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build standard delivery paths and every check
        run: |
          nix build .#set .#setting --no-link
          nix flake check --print-build-logs
