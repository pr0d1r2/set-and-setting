---
name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  guardrails:
    # Local-path reference (not `@main`): resolves to THIS commit's copy of
    # guardrails.yml, so fixes to the reusable workflow on a PR branch are
    # exercised by the PR's own CI. `@main` pinned to main's stale copy, so
    # the darwin-installer fix (B26) never ran on the PR that introduced it.
    uses: ./.github/workflows/guardrails.yml
    secrets: inherit

  lock-budget-comment:
    needs: guardrails
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Report lock growth
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          report="$(bash lib/nix-flake-lock-budget.sh flake.lock 2>&1 || true)"
          bytes="$(printf '%s\n' "$report" | sed -n 's/lock-budget: bytes=\([0-9]*\).*/\1/p')"
          baseline="$(sed -n 's/^baseline_bytes: *//p' config/lefthook/flake_lock_budget.yml)"
          [ -n "$bytes" ] && [ "$bytes" -gt "$baseline" ] || exit 0
          body="<!-- lock-budget-report -->\n### flake.lock growth\n\n\`$report\`\n\nThe committed lock baseline was updated with this lock refresh."
          export BODY="$body"
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate --jq '.[] | select(.body | contains("<!-- lock-budget-report -->")) | .id' | head -n1)"
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -f body="$BODY"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="$BODY"
          fi

  cache-push:
    needs: guardrails
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      NIX_CONFIG: |
        connect-timeout = 15
        download-attempts = 5
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            max-jobs = auto
            extra-substituters = https://pr0d1r2.cachix.org
            extra-trusted-public-keys = pr0d1r2.cachix.org-1:NfWjbhgAj41byXhCKiaE+av3Vnphm1fTezHXEGsiQIM=
      - name: Upload evaluated standard paths
        # Best-effort: a cache is not a check, and every gate has already
        # passed by the time this job runs (B19). The cost of that choice is
        # that a broken token is silent -- read the push step's log, not its
        # conclusion, when cache hits stop appearing.
        continue-on-error: true
        uses: cachix/cachix-action@v15
        with:
          name: pr0d1r2
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # The checks are pushed by the guardrails jobs that build them; this job
      # adds only the two consumer delivery paths, which the flake check does
      # not build.
      - name: Build the standard delivery paths
        run: nix build .#set .#setting --no-link

  cache-push-darwin:
    needs: guardrails
    if: github.event_name == 'push'
    runs-on: macos-latest
    env:
      NIX_CONFIG: |
        connect-timeout = 15
        download-attempts = 5
    steps:
      - uses: actions/checkout@v4
      # Same installer as the darwin guardrails job, for the same reason (B26).
      - uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41
        with:
          extra-conf: |
            max-jobs = auto
            extra-substituters = https://pr0d1r2.cachix.org
            extra-trusted-public-keys = pr0d1r2.cachix.org-1:NfWjbhgAj41byXhCKiaE+av3Vnphm1fTezHXEGsiQIM=
      - name: Upload evaluated standard paths
        continue-on-error: true
        uses: cachix/cachix-action@v15
        with:
          name: pr0d1r2
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # The checks are pushed by the guardrails jobs that build them; this job
      # adds only the two consumer delivery paths, which the flake check does
      # not build.
      - name: Build the standard delivery paths
        run: nix build .#set .#setting --no-link
