---
name: Guardrails

# Reusable CI workflow for leaf consumer repos (#95). A leaf's CI is a
# thin caller (~3 lines) that delegates to this workflow. Steps:
# 1. Checkout + install nix
# 2. Materialize gitignored configs (lefthook.yml, .markdownlint.yml, etc.)
# 3. Run `nix flake check` (all pinned checks run hermetically)
#
# Consumer usage:
#   jobs:
#     guardrails:
#       uses: pr0d1r2/set-and-setting/.github/workflows/guardrails.yml@main

# One run per ref for a pull request: the tending loop force-pushes on every fix
# round, and without this the superseded run keeps a runner busy and competes
# with the run that matters. NEVER on the default branch -- cancelling there
# would kill the cache-push that follows a merge.
concurrency:
  group: guardrails-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

"on":
  workflow_call:
    inputs:
      flake-check-timeout:
        description: Timeout in seconds for nix flake check
        type: string
        default: "600"

env:
  # Apply before flake evaluation so transient input and substituter failures
  # are retried instead of turning one HTTP 5xx into a fleet-wide red check.
  NIX_CONFIG: |
    connect-timeout = 15
    download-attempts = 5

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          # Nix defaults `max-jobs` to 1 and neither installer overrides it,
          # so the 110 independent checks built strictly one at a time. Each
          # is a sandboxed derivation touching no shared state, so they
          # parallelize safely -- unlike the lefthook (B12) and Bats
          # (B16/B18/B70) parallelism this repository had to retire.
          # The cache is also declared in flake.nix `nixConfig`, but flake-
          # supplied config is untrusted: CI logged `ignoring untrusted flake
          # configuration setting 'extra-substituters'` and never fetched from
          # it. Installer config is system config, and trusted.
          extra_nix_config: |
            max-jobs = auto
            extra-substituters = https://pr0d1r2.cachix.org
            extra-trusted-public-keys = pr0d1r2.cachix.org-1:NfWjbhgAj41byXhCKiaE+av3Vnphm1fTezHXEGsiQIM=
      - name: Materialize configs
        run: nix develop --command true
      - name: Confirm materialization
        run: nix run .#confirm
      - name: Nix flake check
        env:
          FLAKE_CHECK_TIMEOUT: ${{ inputs.flake-check-timeout }}
        run: bash .github/scripts/flake-check.sh
      - name: Bats suite
        run: bash .github/scripts/bats-suite.sh

  check-darwin:
    # No `needs: check`. The two platforms build the same 110 checks from the
    # same pinned inputs and share no state, so gating darwin behind linux
    # bought nothing but wall-clock: darwin idled 3m28s per run. Both jobs
    # now start together.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # DeterminateSystems installer detects and reuses an existing Nix /
      # `_nixbld` group on the macos-latest image instead of erroring with
      # `dscl ... eDSRecordAlreadyExists` (-14135) the way the older
      # cachix/install-nix-action shell installer does (B26).
      - uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41
        with:
          # See the ubuntu job: nix's default `max-jobs` of 1 serialized every
          # check. Darwin paid most for it -- one 105-second derivation with
          # 770 idle behind it.
          extra-conf: |
            max-jobs = auto
            extra-substituters = https://pr0d1r2.cachix.org
            extra-trusted-public-keys = pr0d1r2.cachix.org-1:NfWjbhgAj41byXhCKiaE+av3Vnphm1fTezHXEGsiQIM=
      - name: Materialize configs
        run: bash .github/scripts/materialize-setting.sh
      - name: Nix flake check
        env:
          FLAKE_CHECK_TIMEOUT: ${{ inputs.flake-check-timeout }}
        run: bash .github/scripts/flake-check.sh
