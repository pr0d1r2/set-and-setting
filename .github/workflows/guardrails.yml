---
name: Guardrails

# Reusable CI workflow for leaf consumer repos (#95). A leaf's CI is a
# thin caller (~3 lines) that delegates to this workflow. Steps:
# 1. Checkout + install nix
# 2. Materialize gitignored configs (lefthook.yml, .markdownlint.yml, etc.)
# 3. Run `nix flake check` (all pinned checks run hermetically)
#
# Consumer usage:
#   jobs:
#     guardrails:
#       uses: pr0d1r2/set-and-setting/.github/workflows/guardrails.yml@main

"on":
  workflow_call:
    inputs:
      flake-check-timeout:
        description: Timeout in seconds for nix flake check
        type: string
        default: "600"
    secrets:
      cachix-auth-token:
        description: >-
          Token for the shared binary cache. Optional: without it the push
          step is skipped and the workflow still gates normally.
        required: false

env:
  # Apply before flake evaluation so transient input and substituter failures
  # are retried instead of turning one HTTP 5xx into a fleet-wide red check.
  NIX_CONFIG: |
    connect-timeout = 15
    download-attempts = 5

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.cachix-auth-token }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          # Nix defaults `max-jobs` to 1 and neither installer overrides it,
          # so the 110 independent checks built strictly one at a time. Each
          # is a sandboxed derivation touching no shared state, so they
          # parallelize safely -- unlike the lefthook (B12) and Bats
          # (B16/B18/B70) parallelism this repository had to retire.
          # The cache is also declared in flake.nix `nixConfig`, but flake-
          # supplied config is untrusted: CI logged `ignoring untrusted flake
          # configuration setting 'extra-substituters'` and never fetched from
          # it. Installer config is system config, and trusted.
          extra_nix_config: |
            max-jobs = auto
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            extra-substituters = https://pr0d1r2.cachix.org
            extra-trusted-public-keys = pr0d1r2.cachix.org-1:NfWjbhgAj41byXhCKiaE+av3Vnphm1fTezHXEGsiQIM=
      # The job that builds is the job that pushes. A separate push job has to
      # rebuild every derivation this one just discarded -- measured at 116s
      # (linux) and 360s (darwin) of duplicate work per push to main. Skipped
      # without a token (fork pull requests, consumers with no cache), and
      # non-gating either way: a cache is not a check (B19).
      - name: Push built paths to the shared cache
        if: env.CACHIX_AUTH_TOKEN != ''
        continue-on-error: true
        uses: cachix/cachix-action@v15
        with:
          name: pr0d1r2
          authToken: ${{ secrets.cachix-auth-token }}
      - name: Materialize configs
        run: nix develop --command true
      - name: Confirm materialization
        run: nix run .#confirm
      - name: Nix flake check
        run: |
          nix flake check \
            --refresh \
            --print-build-logs \
            --timeout ${{ inputs.flake-check-timeout }}
      - name: Bats suite
        run: |
          mapfile -d '' bats_files < <(git ls-files -z -- '*.bats')
          if [ "${#bats_files[@]}" -gt 0 ]; then
            nix develop --command lefthook-bats-parse "${bats_files[@]}"
            # `bats` itself is not in a consumer devShell -- only the
            # wrappers are -- so calling it directly fails every consumer
            # with `exec: bats: not found` while passing here, where the
            # standard's own shell has it. The wrapper is also already
            # sequential: it runs bats with no `--jobs` unless
            # LEFTHOOK_BATS_UNIT_JOBS asks for them, which is the
            # determinism this step wanted (B91).
            nix develop --command lefthook-bats-unit "${bats_files[@]}"
            # The bats fragment -- and so the tdd-order-bats wrapper -- is
            # materialized only for a repository with tracked .bats files,
            # so this gate belongs inside the same guard as the suite.
            nix develop --command lefthook-tdd-order-bats
          fi

  check-darwin:
    # No `needs: check`. The two platforms build the same 110 checks from the
    # same pinned inputs and share no state, so gating darwin behind linux
    # bought nothing but wall-clock: darwin idled 3m28s per run. Both jobs
    # now start together.
    runs-on: macos-latest
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.cachix-auth-token }}
    steps:
      - uses: actions/checkout@v4
      # DeterminateSystems installer detects and reuses an existing Nix /
      # `_nixbld` group on the macos-latest image instead of erroring with
      # `dscl ... eDSRecordAlreadyExists` (-14135) the way the older
      # cachix/install-nix-action shell installer does (B26).
      - uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41
        with:
          # See the ubuntu job: nix's default `max-jobs` of 1 serialized every
          # check. Darwin paid most for it -- one 105-second derivation with
          # 770 idle behind it.
          extra-conf: |
            max-jobs = auto
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            extra-substituters = https://pr0d1r2.cachix.org
            extra-trusted-public-keys = pr0d1r2.cachix.org-1:NfWjbhgAj41byXhCKiaE+av3Vnphm1fTezHXEGsiQIM=
      # Same reason as the ubuntu job: whoever builds, pushes.
      - name: Push built paths to the shared cache
        if: env.CACHIX_AUTH_TOKEN != ''
        continue-on-error: true
        uses: cachix/cachix-action@v15
        with:
          name: pr0d1r2
          authToken: ${{ secrets.cachix-auth-token }}
      - name: Materialize configs
        run: |
          setting_pkg="$(nix build .#setting --print-out-paths --no-link)"
          "$setting_pkg/bin/sync-setting" .
      - name: Nix flake check
        run: |
          nix flake check \
            --refresh \
            --print-build-logs \
            --timeout ${{ inputs.flake-check-timeout }}
