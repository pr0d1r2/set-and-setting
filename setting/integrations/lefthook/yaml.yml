# yamllint is delivered as a devShell wrapper (nix-lefthook-yamllint).
# No runtime remotes -- CI gate is `nix flake check` (#102 FLIP).
---

pre-commit:
  commands:
    yamllint:
      glob: "*.{yml,yaml}"
      run: timeout ${LEFTHOOK_YAMLLINT_TIMEOUT:-30} lefthook-yamllint {staged_files}

pre-push:
  commands:
    yamllint:
      glob: "*.{yml,yaml}"
      run: timeout ${LEFTHOOK_YAMLLINT_TIMEOUT:-30} lefthook-yamllint {push_files}
