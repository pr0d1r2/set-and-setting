# shfmt is intentionally absent here: it is delivered as a PINNED flake
# `checks.<sys>.shfmt` (set-and-setting.lib.mkShfmtCheck / #98), replacing the
# runtime `remotes:` git_url with an offline-runnable, cache-warm check. The
# remaining shell linters follow per #93's strangler-fig decomposition.
---
remotes:
  - git_url: https://github.com/pr0d1r2/nix-lefthook-shellcheck
    ref: main
    configs:
      - lefthook-remote.yml
  - git_url: https://github.com/pr0d1r2/nix-lefthook-no-shell-functions
    ref: main
    configs:
      - lefthook-remote.yml
