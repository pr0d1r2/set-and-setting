# markdownlint and markdownlint-agentic are delivered as devShell wrappers
# (nix-lefthook-markdownlint, nix-lefthook-markdownlint-agentic). No
# runtime remotes -- CI gate is `nix flake check` (#102 FLIP).
---

pre-commit:
  commands:
    lint-arch-diagram:
      glob: "README.md"
      run: lefthook-lint-arch-diagram {staged_files}
    lint-badge-version:
      glob: "README.md"
      run: lefthook-lint-badge-version flake.nix README.md flake.lock
    lint-badge-order:
      glob: "README.md"
      run: lefthook-lint-badge-order {staged_files}
    markdownlint:
      glob: "*.md"
      run: timeout ${LEFTHOOK_MARKDOWNLINT_TIMEOUT:-30} lefthook-markdownlint {staged_files}
    markdownlint-agentic:
      glob: "*.md"
      run: timeout ${LEFTHOOK_MARKDOWNLINT_AGENTIC_TIMEOUT:-30} lefthook-markdownlint-agentic {staged_files}

pre-push:
  commands:
    lint-arch-diagram:
      glob: "README.md"
      run: lefthook-lint-arch-diagram {push_files}
    markdownlint:
      glob: "*.md"
      run: timeout ${LEFTHOOK_MARKDOWNLINT_TIMEOUT:-30} lefthook-markdownlint {push_files}
    markdownlint-agentic:
      glob: "*.md"
      run: timeout ${LEFTHOOK_MARKDOWNLINT_AGENTIC_TIMEOUT:-30} lefthook-markdownlint-agentic {push_files}
