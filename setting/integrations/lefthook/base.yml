---

# These fast, staged-file checks prevent secrets and git hygiene violations
# from entering history. Their pinned flake checks remain the authoritative
# hermetic full-tree gate.
pre-commit:
  commands:
    changelog-touched:
      run: lefthook-changelog-touched
    gitleaks:
      run: lefthook-gitleaks {staged_files}
    git-conflict-markers:
      run: lefthook-git-conflict-markers {staged_files}
    git-no-local-paths:
      run: lefthook-git-no-local-paths {staged_files}
    nix-flake-check:
      glob: "*.nix"
      run: timeout ${LEFTHOOK_NIX_FLAKE_CHECK_TIMEOUT:-600} nix flake check

pre-push:
  commands:
    linter-coverage:
      run: timeout ${LEFTHOOK_LINTER_COVERAGE_FULL_TIMEOUT:-30} lefthook-linter-coverage-full
    nix-flake-check:
      # NO glob. `nix flake check` validates the WHOLE tree -- markdown, YAML,
      # shell, dictionaries, the emitted lefthook config -- so gating it on
      # `*.nix` let every non-nix change reach CI ungated by it. CI runs it
      # unconditionally, which made green-local/red-CI structural for exactly
      # the changes least likely to be suspected: a config edit, a doc, a
      # fragment. Pre-commit keeps the glob; this is the gate before the push,
      # and it costs what CI costs.
      run: timeout ${LEFTHOOK_NIX_FLAKE_CHECK_TIMEOUT:-600} nix flake check

commit-msg:
  commands:
    commit-msg-lint:
      run: lefthook-commit-msg-lint {1}
