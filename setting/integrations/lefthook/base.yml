---

# These fast, staged-file checks prevent secrets and git hygiene violations
# from entering history. Their pinned flake checks remain the authoritative
# hermetic full-tree gate.
pre-commit:
  commands:
    gitleaks:
      run: lefthook-gitleaks {staged_files}
    git-conflict-markers:
      run: lefthook-git-conflict-markers {staged_files}
    git-no-local-paths:
      run: lefthook-git-no-local-paths {staged_files}
