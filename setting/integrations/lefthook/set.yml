---
pre-commit:
  commands:
    rekall-check:
      glob: "{set/skills/**,.rekall/**}"
      run: >
        if command -v rekall >/dev/null 2>&1; then rekall check;
        else echo "lefthook SKIPPED rekall check -- not on PATH"; fi
    rekall-gnu-sed:
      glob: "*.{sh,bash,nix,yml,yaml}"
      run: sh .rekall/rules/always-use-sed-from-the-dev.sh
    set-skill-extension:
      glob: "set/{skills,drafts}/**"
      run: SET_ROOT=set lefthook-skill-extension-check
    set-skill-size:
      glob: "set/{skills,drafts}/**/*.md"
      run: SET_ROOT=set lefthook-skill-size-check
    set-ref-resolution:
      glob: "set/**/*.md"
      run: SET_ROOT=set lefthook-ref-resolve-check
    set-bundle-content:
      glob: "set/**/*.md"
      run: SET_ROOT=set lefthook-bundle-content-check

pre-push:
  commands:
    rekall-check:
      glob: "{set/skills/**,.rekall/**}"
      run: >
        if command -v rekall >/dev/null 2>&1; then rekall check;
        else echo "lefthook SKIPPED rekall check -- not on PATH"; fi
    rekall-gnu-sed:
      glob: "*.{sh,bash,nix,yml,yaml}"
      run: sh .rekall/rules/always-use-sed-from-the-dev.sh
    set-skill-extension:
      glob: "set/{skills,drafts}/**"
      run: SET_ROOT=set lefthook-skill-extension-check
    set-skill-size:
      glob: "set/{skills,drafts}/**/*.md"
      run: SET_ROOT=set lefthook-skill-size-check
    set-ref-resolution:
      glob: "set/**/*.md"
      run: SET_ROOT=set lefthook-ref-resolve-check
    set-bundle-content:
      glob: "set/**/*.md"
      run: SET_ROOT=set lefthook-bundle-content-check
