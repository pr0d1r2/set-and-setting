# actionlint validates GitHub Actions workflow semantics, which yamllint does
# not cover.
---

pre-commit:
  commands:
    actionlint:
      glob: ".github/workflows/*.{yml,yaml}"
      run: timeout ${LEFTHOOK_ACTIONLINT_TIMEOUT:-30} lefthook-actionlint {staged_files}
    ci-lint-token:
      glob: "{flake.nix,.github/workflows/*.{yml,yaml}}"
      run: timeout ${LEFTHOOK_CI_LINT_TOKEN_TIMEOUT:-30} lefthook-ci-lint-token {staged_files}
      timeout: 30s
    ci-lint-qemu-order:
      glob: ".github/workflows/*.{yml,yaml}"
      run: timeout ${LEFTHOOK_CI_LINT_QEMU_ORDER_TIMEOUT:-30} lefthook-ci-lint-qemu-order {staged_files}
      timeout: 30s
    ci-lint-sha:
      glob: ".github/workflows/*.{yml,yaml}"
      run: timeout ${LEFTHOOK_CI_LINT_SHA_TIMEOUT:-30} lefthook-ci-lint-sha {staged_files}
      timeout: 30s

pre-push:
  commands:
    actionlint:
      glob: ".github/workflows/*.{yml,yaml}"
      run: timeout ${LEFTHOOK_ACTIONLINT_TIMEOUT:-30} lefthook-actionlint {push_files}
    ci-lint-token:
      glob: "{flake.nix,.github/workflows/*.{yml,yaml}}"
      run: timeout ${LEFTHOOK_CI_LINT_TOKEN_TIMEOUT:-30} lefthook-ci-lint-token {push_files}
      timeout: 30s
    ci-lint-qemu-order:
      glob: ".github/workflows/*.{yml,yaml}"
      run: timeout ${LEFTHOOK_CI_LINT_QEMU_ORDER_TIMEOUT:-30} lefthook-ci-lint-qemu-order {push_files}
      timeout: 30s
    ci-lint-sha:
      glob: ".github/workflows/*.{yml,yaml}"
      run: timeout ${LEFTHOOK_CI_LINT_SHA_TIMEOUT:-30} lefthook-ci-lint-sha {push_files}
      timeout: 30s
