---
name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Linux gates the expensive jobs (darwin runner + native aarch64 runner).
# The embedded cachix in nix-lefthook-ci-action targeted Node.js 20 and
# failed on Node.js 24 runners (B8/B10); keep it disabled with
# cachix-cache: "" and set up cachix separately if needed.
#
# Materialized configs (.markdownlint.yml, .yamllint.yml) are
# gitignored (V22) and must be synced before hooks run. The sync
# pre-step builds packages.setting and copies configs into the
# workspace. The CI action re-checks-out tracked files but preserves
# untracked (gitignored) files, so synced configs survive.

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Sync materialized configs
        run: |
          setting_pkg="$(nix build .#setting --print-out-paths --no-link)"
          "$setting_pkg/bin/sync-setting" .
      - uses: pr0d1r2/nix-lefthook-ci-action@9fd689df8098290d9bbff25d68c8ca9cddfbcee0
        with:
          devshell: "default"
          skip-build: "true"
          cachix-cache: ""
          extra-env: >-
            GIT_OPTIONAL_LOCKS=0
          keep-home: "true"
          flake-check-timeout: "600"
          flake-eval-timeout: "120"

  build-darwin:
    needs: build-linux
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Sync materialized configs
        run: |
          setting_pkg="$(nix build .#setting --print-out-paths --no-link)"
          "$setting_pkg/bin/sync-setting" .
      - uses: pr0d1r2/nix-lefthook-ci-action@9fd689df8098290d9bbff25d68c8ca9cddfbcee0
        with:
          devshell: "default"
          skip-build: "true"
          cachix-cache: ""
          extra-env: >-
            GIT_OPTIONAL_LOCKS=0
          keep-home: "true"
          flake-check-timeout: "600"
          flake-eval-timeout: "120"

  build-linux-arm:
    needs: build-linux
    # Native ARM runner: the action runs `nix build` for the host system, so
    # an x86_64 runner with extra-platforms never builds aarch64-linux.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Sync materialized configs
        run: |
          setting_pkg="$(nix build .#setting --print-out-paths --no-link)"
          "$setting_pkg/bin/sync-setting" .
      - uses: pr0d1r2/nix-lefthook-ci-action@9fd689df8098290d9bbff25d68c8ca9cddfbcee0
        with:
          devshell: "default"
          skip-build: "true"
          cachix-cache: ""
          extra-env: >-
            GIT_OPTIONAL_LOCKS=0
          keep-home: "true"
          flake-check-timeout: "600"
          flake-eval-timeout: "120"
